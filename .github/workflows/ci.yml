name: ci

on:
  pull_request:
  push:
    branches: [main, lua-engine-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test -c Release

  # Analyzer failures are part of ci-gate: the build above already fails on LD001-LD005, banned APIs and
  # AOT analyzers (warnings and analyzer diagnostics are errors); this job proves that, and ratchets suppressions.
  fast-checks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Suppression ratchet (count may only decrease)
        run: node ci/check-suppressions.js ${{ github.base_ref && format('--base-ref origin/{0}', github.base_ref) || '' }}
      - run: node --test ci/check-suppressions.test.js
      - name: Analyzer canary (violations of every rule fail the build)
        run: node ci/analyzer-canary.js

  # The single aggregate check required by branch protection (ADR/ticket 18).
  # Later tickets add their jobs to `needs`; nightly and benchmark jobs never block.
  ci-gate:
    if: always()
    needs: [build, test, fast-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "an upstream job did not succeed"; exit 1
          fi
