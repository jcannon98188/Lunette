name: ci

on:
  pull_request:
  push:
    branches: [main, lua-engine-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test -c Release
      # String-engine variants (ADR 0005): correctness must not depend on interning or on hash quality.
      - name: Tests with constant hash
        run: dotnet test -c Release --no-build tests/Lunette.Tests
        env:
          LUNETTE_CONSTANT_HASH: "1"
      - name: Tests with capacity-1 intern cache
        run: dotnet test -c Release --no-build tests/Lunette.Tests
        env:
          LUNETTE_INTERN_CAPACITY: "1"

  # Analyzer failures are part of ci-gate: the build above already fails on LD001-LD005, banned APIs and
  # AOT analyzers (warnings and analyzer diagnostics are errors); this job proves that, and ratchets suppressions.
  fast-checks:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Suppression ratchet (count may only decrease)
        run: node ci/check-suppressions.js ${{ github.base_ref && format('--base-ref origin/{0}', github.base_ref) || '' }}
      - run: node --test ci/check-suppressions.test.js
      - name: Analyzer canary (violations of every rule fail the build)
        run: node ci/analyzer-canary.js

  # The suite runs per file inside `test` (tests/Lunette.Tests/Suite); this job guards the ratchet list itself.
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node ci/check-required-files.mjs origin/${{ github.base_ref || 'main' }}

  # Reference binary (PUC Lua 5.4.9) from checksummed source; Linux only. Cached by version, tarball SHA and runner image.
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .reference
          key: reference-lua-5.4.9-2335b6c5-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest
      - run: ci/build-reference.sh .reference
      - uses: actions/upload-artifact@v4
        with:
          name: reference-lua
          path: .reference/lua
          retention-days: 14

  # Allocation budgets (alloc-budgets.json) and the interpreter-loop JIT budget (jit-budgets.json); both are part of ci-gate.
  # They need a Release build and the plain JIT path (R2R and NativeAOT skip the MinOpts thresholds), so they get their own job.
  alloc-budget:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LUNETTE_REQUIRE_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test -c Release --filter "FullyQualifiedName~Lunette.Tests.AllocationTests" tests/Lunette.Tests

  jit-budget:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LUNETTE_REQUIRE_RELEASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test -c Release --filter "FullyQualifiedName~Lunette.Tests.JitBudgetTests|FullyQualifiedName~Lunette.Tests.JitProbeTests" tests/Lunette.Tests
      - name: Upload JIT disasm summaries on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jit-disasm
          path: /tmp/lunette-jit-*.txt
          retention-days: 14

  # io/os platform interface (ticket 13): files.lua and main.lua on the other operating systems. The platform-specific
  # shell-dependent parts are waived per OS in tests/suite/waivers.toml (reason os-env, platform key); Linux runs them in full in `test`.
  platform-suite:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test -c Release --filter "DisplayName~files.lua|DisplayName~main.lua" tests/Lunette.Tests

  # The single aggregate check required by branch protection (ADR/ticket 18).
  # Later tickets add their jobs to `needs`; nightly and benchmark jobs never block.
  ci-gate:
    if: always()
    needs: [build, test, ratchet, reference, fast-checks, alloc-budget, jit-budget, platform-suite]
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "an upstream job did not succeed"; exit 1
          fi
