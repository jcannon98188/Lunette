name: ci

on:
  pull_request:
  push:
    branches: [main, lua-engine-build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test -c Release

  # The suite runs per file inside `test` (tests/Lunette.Tests/Suite); this job guards the ratchet list itself.
  ratchet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node ci/check-required-files.mjs origin/${{ github.base_ref || 'main' }}

  # Reference binary (PUC Lua 5.4.9) from checksummed source; Linux only. Cached by version, tarball SHA and runner image.
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .reference
          key: reference-lua-5.4.9-2335b6c5-${{ runner.os }}-${{ runner.arch }}-ubuntu-latest
      - run: ci/build-reference.sh .reference
      - uses: actions/upload-artifact@v4
        with:
          name: reference-lua
          path: .reference/lua
          retention-days: 14

  # The single aggregate check required by branch protection (ADR/ticket 18).
  # Later tickets add their jobs to `needs`; nightly and benchmark jobs never block.
  ci-gate:
    if: always()
    needs: [build, test, ratchet, reference]
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to succeed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "an upstream job did not succeed"; exit 1
          fi
